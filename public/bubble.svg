<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bubbleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>
  <!-- Shiny bubble body -->
  <circle cx="16" cy="16" r="14" fill="url(#bubbleGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Highlight shine reflection -->
  <ellipse cx="11" cy="10" rx="4.5" ry="2.5" fill="#ffffff" opacity="0.85" transform="rotate(-30 11 10)"/>
  <circle cx="21" cy="20" r="1.5" fill="#ffffff" opacity="0.6"/>
</svg>

